html_content = """<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現在地から探す！飲食店おみくじガチャ</title>
    <style>
        :root {
            --primary: #ff6b6b;
            --primary-dark: #ee5253;
            --secondary: #feca57;
            --accent: #48dbfb;
            --dark: #222f3e;
            --light: #f7f1e3;
            --card-bg: #ffffff;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        body {
            background-color: var(--light);
            color: var(--dark);
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2rem;
            color: var(--primary-dark);
            margin-bottom: 10px;
        }
        p.subtitle {
            color: #576574;
            font-size: 0.95rem;
        }
        
        /* 設定エリア */
        .settings-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 5px solid var(--primary);
        }
        .setting-group {
            margin-bottom: 15px;
        }
        .setting-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--dark);
        }
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #dfe4ea;
            border-radius: 8px;
            font-size: 1rem;
            background: #fff;
        }

        /* ボタン類 */
        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
        button {
            border: none;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        button:active { transform: translateY(1px); box-shadow: 0 2px 3px rgba(0,0,0,0.1); }
        
        .btn-gps {
            background-color: var(--primary);
            color: white;
        }
        .btn-demo {
            background-color: #2ed573;
            color: white;
        }

        /* ステータスメッセージ */
        #status-message {
            margin-top: 15px;
            font-size: 0.95rem;
            font-weight: bold;
            text-align: center;
            color: #576574;
        }

        /* 結果カード */
        .result-card {
            background: #fdfbf7;
            border: 2px dashed #dfe4ea;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }
        .result-card.active {
            display: block;
        }

        /* おみくじアニメーション */
        .shaking-box {
            text-align: center;
            font-size: 4rem;
            animation: shake 0.5s infinite;
            margin-top: 10px;
        }
        .omikuji-paper {
            background: #fff;
            border: 3px solid var(--primary);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            animation: pulse 1.5s infinite;
            transition: transform 0.2s;
            margin: 10px auto;
            max-width: 280px;
        }
        .omikuji-paper:hover { transform: scale(1.05); }
        .omikuji-icon { font-size: 3.5rem; margin-bottom: 10px; }
        .reveal-anim { animation: fadeIn 0.6s ease-out forwards; text-align: center;}
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shake { 0%, 100% { transform: translateX(0) rotate(0deg); } 25% { transform: translateX(-5px) rotate(-10deg); } 75% { transform: translateX(5px) rotate(10deg); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.5); } 70% { box-shadow: 0 0 0 15px rgba(255, 107, 107, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); } }

        /* 店舗情報 */
        .store-name { font-size: 1.4rem; font-weight: bold; color: var(--dark); margin-bottom: 10px; }
        .store-desc { font-size: 1rem; color: #576574; margin-bottom: 15px; }
        .store-hours { display: inline-block; background: #fffa65; padding: 4px 10px; border-radius: 4px; font-weight: bold; margin-bottom: 15px; font-size: 0.9rem;}
        .map-link { display: inline-block; background: #00d2d3; color: white; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; }
        .map-link:hover { background: #01a3a4; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🍱 どこでも飲食店ガチャ</h1>
            <p class="subtitle">現在地や指定エリアから、今日のご飯をランダム決定！</p>
        </header>

        <div class="settings-card">
            <!-- 検索条件 -->
            <div class="setting-group">
                <label>🚶‍♂️ 移動手段は？</label>
                <select id="transport">
                    <option value="walk">徒歩 (のんびり)</option>
                    <option value="bicycle">自転車 (スイスイ)</option>
                    <option value="car">車 (ドライブ)</option>
                </select>
            </div>
            <div class="setting-group">
                <label>⏱️ かけられる時間は？</label>
                <select id="minutes">
                    <option value="5">5分以内 (超近場)</option>
                    <option value="10" selected>10分以内 (ちょうどいい)</option>
                    <option value="15">15分以内 (少し遠出)</option>
                    <option value="30">30分以内 (がっつり移動)</option>
                </select>
            </div>

            <!-- アクションボタン -->
            <div class="action-btns">
                <button class="btn-gps" onclick="searchCurrentLocation()">📍 現在地周辺から探す (GPS)</button>
                
                <div style="display:flex; gap:10px;">
                    <select id="demo-area" style="flex:1;">
                        <option value="hiroshima">🏙️ 広島駅周辺 (デモ)</option>
                        <option value="matsuyama">🏙️ 松山 大街道周辺 (デモ)</option>
                        <option value="tokyo">🏙️ 東京駅周辺 (デモ)</option>
                    </select>
                    <button class="btn-demo" style="flex:1;" onclick="searchDemoLocation()">デモを回す</button>
                </div>
            </div>
            
            <!-- メッセージ表示エリア -->
            <div id="status-message"></div>
        </div>

        <!-- 結果表示エリア -->
        <div id="result-area" class="result-card"></div>
    </div>

    <script>
        // サンプル店舗データ（API接続前のお試し用）
        const db = {
            hiroshima: [
                { name: "お好み焼き みっちゃん総本店", desc: "広島風お好み焼きの超定番！行列必至の名店です。", hours: "11:00〜21:00", placeId: "" },
                { name: "陽気 広島駅前店", desc: "広島ラーメン（醤油豚骨）の老舗。コクがあるのにあっさり！", hours: "11:00〜22:00", placeId: "" },
                { name: "牡蠣亭", desc: "広島名物の新鮮な牡蠣料理を一年中楽しめるお店。", hours: "11:00〜15:00 / 17:00〜21:00", placeId: "" }
            ],
            matsuyama: [
                { name: "郷土料理 五志喜 本店", desc: "愛媛名物「鯛めし」や「五色そうめん」が味わえる老舗。", hours: "11:00〜21:00", placeId: "" },
                { name: "アサヒ", desc: "松山市民のソウルフード！甘めの出汁が特徴の鍋焼きうどん。", hours: "10:00〜14:00 (売切次第終了)", placeId: "" },
                { name: "霧の森菓子工房 松山店", desc: "食後のデザートに！大人気の「霧の森大福」があるお店。", hours: "10:00〜19:00", placeId: "" }
            ],
            tokyo: [
                { name: "六厘舎 東京ラーメンストリート", desc: "濃厚な魚介豚骨つけ麺！東京駅の地下で大行列。", hours: "7:30〜22:30", placeId: "" },
                { name: "近畿大学水産研究所 銀座店", desc: "近大マグロなど、こだわりの養殖魚が食べられる話題のお店。", hours: "11:30〜14:00 / 17:00〜22:00", placeId: "" },
                { name: "矢場とん 東京駅グランルーフ店", desc: "名古屋名物のみそかつが東京駅でも味わえる！", hours: "11:00〜23:00", placeId: "" }
            ],
            gps_dummy: [
                { name: "📍 あなたの現在地付近の美味しいお店 A", desc: "【テスト用】APIを連携すると、ここに本物のお店が出ます！", hours: "11:00〜22:00", placeId: "" },
                { name: "📍 あなたの現在地付近の美味しいお店 B", desc: "【テスト用】指定した移動範囲内に実在する店舗が表示されます。", hours: "10:00〜20:00", placeId: "" }
            ]
        };

        // 選ばれたデータを保持する変数
        let currentSelectedStore = null;

        // 移動手段と時間から検索半径（メートル）を計算
        function calculateRadius(transport, minutes) {
            let speed = 80; // 徒歩: 分速80m
            if (transport === 'bicycle') speed = 250; // 自転車: 分速250m
            if (transport === 'car') speed = 500; // 車: 分速500m
            return speed * minutes;
        }

        // ① 現在地(GPS)から探す処理
        function searchCurrentLocation() {
            const transport = document.getElementById('transport').value;
            const minutes = parseInt(document.getElementById('minutes').value);
            const radius = calculateRadius(transport, minutes);
            const statusEl = document.getElementById('status-message');

            statusEl.innerHTML = "📡 スマホのGPSで現在地を取得中...";
            document.getElementById('result-area').classList.remove('active');

            // GPS機能がないブラウザの場合
            if (!navigator.geolocation) {
                statusEl.innerHTML = "❌ お使いのブラウザはGPSに対応していません。";
                return;
            }

            // GPSのオプション設定
            const options = {
                enableHighAccuracy: false, // 速度重視
                timeout: 10000,            // 10秒でタイムアウト
                maximumAge: 60000          // 1分以内の古いデータも許容
            };

            // GPS取得実行
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    // 成功時
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    statusEl.innerHTML = `✅ <b>現在地を取得しました！</b><br><small>検索半径: ${radius}m 圏内 (緯度:${lat.toFixed(3)}, 経度:${lng.toFixed(3)})</small><br><span style="color:#ee5253;">※現在はAPI連携前のため、サンプルのGPS結果を表示します。</span>`;
                    
                    // API連携前なので、ダミーのGPSリストを使ってガチャを回す
                    executeGacha(db.gps_dummy);
                },
                (error) => {
                    // 失敗時（エラー理由を細かく判定して表示）
                    let errorMsg = "";
                    switch (error.code) {
                        case error.PERMISSION_DENIED:
                            errorMsg = "❌ 位置情報がブロックされています。ブラウザのURL横の「ぁあ」や「鍵マーク」から位置情報を許可し、再読み込みしてください。";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMsg = "❌ 電波状況などで現在地が取得できませんでした。";
                            break;
                        case error.TIMEOUT:
                            errorMsg = "❌ 取得に時間がかかりすぎました（タイムアウト）。もう一度お試しください。";
                            break;
                        default:
                            errorMsg = "❌ エラーが発生しました。";
                            break;
                    }
                    statusEl.innerHTML = errorMsg;
                },
                options
            );
        }

        // ② デモエリアから探す処理
        function searchDemoLocation() {
            const areaKey = document.getElementById('demo-area').value;
            const transport = document.getElementById('transport').value;
            const minutes = document.getElementById('minutes').value;
            const radius = calculateRadius(transport, minutes);
            
            const statusEl = document.getElementById('status-message');
            
            // 選択されたエリアの名前に変換
            let areaName = "";
            if(areaKey === "hiroshima") areaName = "広島駅周辺";
            if(areaKey === "matsuyama") areaName = "松山 大街道周辺";
            if(areaKey === "tokyo") areaName = "東京駅周辺";

            statusEl.innerHTML = `✅ デモモード: <b>${areaName}</b> から ${radius}m圏内で検索しました！`;
            
            executeGacha(db[areaKey]);
        }

        // ガチャ（おみくじ）の演出を実行する
        function executeGacha(storeList) {
            const card = document.getElementById('result-area');
            card.className = "result-card active";
            
            // ランダムに1店舗選ぶ
            currentSelectedStore = storeList[Math.floor(Math.random() * storeList.length)];

            // 筒を振るアニメーション (2秒間)
            card.innerHTML = `
                <div class="shaking-box">🎋</div>
                <div style="text-align:center; color:var(--primary-dark); font-weight:bold; margin-top:10px;">
                    お店を抽選中……
                </div>
            `;

            setTimeout(() => {
                // 2秒後におみくじの紙を表示
                card.innerHTML = `
                    <div class="omikuji-paper" onclick="revealResult()">
                        <div class="omikuji-icon">📜</div>
                        <p style="font-weight:bold; color:var(--primary-dark); font-size:1.2rem;">お店が決まりました！</p>
                        <p style="font-size:0.9rem; color:#555; margin-top:5px;">（タップして開く）</p>
                    </div>
                `;
            }, 2000);
        }

        // おみくじをタップして結果を表示
        function revealResult() {
            if (!currentSelectedStore) return;
            const item = currentSelectedStore;
            const card = document.getElementById('result-area');

            // Googleマップ検索用のURL生成
            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name)}`;

            card.innerHTML = `
                <div class="reveal-anim">
                    <div style="font-size:3rem; margin-bottom:10px;">🎊</div>
                    <div class="store-name">${item.name}</div>
                    <div class="store-desc">${item.desc}</div>
                    <div class="store-hours">🕒 営業時間: ${item.hours}</div><br>
                    <a class="map-link" href="${mapUrl}" target="_blank">🗺️ Googleマップでナビ開始</a>
                </div>
            `;
        }
    </script>
</body>
</html>
"""
with open("index.html", "w", encoding="utf-8") as f:
    f.write(html_content)
